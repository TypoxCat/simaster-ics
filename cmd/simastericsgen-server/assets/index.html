<!-- Modified from the original SimasterICSGen project: redesigned UI and download handling. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMASTER ICS Generator</title>
    <script src="autogenerated/wasm_exec.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #ffffff;
            color: #000000;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            color: #333;
        }

        /* File Upload */
        .drop-zone {
            border: 2px dashed #999;
            border-radius: 6px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background-color: #fafafa;
        }

        .drop-zone:hover {
            border-color: #333;
            background-color: #f5f5f5;
        }

        .drop-zone.active {
            border-color: #333;
            background-color: #f0f0f0;
        }

        .drop-zone-text {
            font-size: 14px;
            color: #666;
        }

        .drop-zone-icon {
            font-size: 32px;
            margin-bottom: 10px;
            opacity: 0.7;
        }

        #htmlFileInput {
            display: none;
        }

        /* Type Selection */
        .type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .type-option {
            flex: 1;
        }

        .type-option input[type="radio"] {
            display: none;
        }

        .type-option label {
            display: block;
            padding: 12px 16px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            background-color: #fff;
        }

        .type-option input[type="radio"]:checked + label {
            border-color: #000;
            background-color: #000;
            color: #fff;
        }

        .type-option label:hover {
            border-color: #333;
        }

        /* Status & Results */
        .status-box {
            display: none;
            padding: 16px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .status-box.show {
            display: block;
        }

        .status-box.loading {
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            color: #666;
        }

        .status-box.success {
            background-color: #f0f0f0;
            border: 1px solid #000;
            color: #000;
        }

        .status-box.error {
            background-color: #fef0f0;
            border: 1px solid #cc0000;
            color: #cc0000;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #ddd;
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Download Button */
        .download-btn {
            width: 100%;
            padding: 12px 16px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: none;
        }

        .download-btn.show {
            display: block;
        }

        .download-btn:hover {
            background-color: #333;
        }

        .download-btn:active {
            background-color: #000;
            transform: scale(0.98);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background-color: #000;
            color: #fff;
            border-radius: 4px;
            font-size: 13px;
            opacity: 0;
            transform: translateY(100px);
            transition: all 0.3s;
            pointer-events: none;
            z-index: 1000;
            max-width: 300px;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .toast.error {
            background-color: #cc0000;
        }

        /* Footer */
        footer {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #999;
            text-align: center;
        }

        footer a {
            color: #333;
            text-decoration: none;
            border-bottom: 1px solid #e0e0e0;
        }

        footer a:hover {
            color: #000;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 20px 16px;
            }

            h1 {
                font-size: 24px;
            }

            .type-selector {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SIMASTER ICS Generator</h1>
            <p class="subtitle">Convert SIMASTER schedule to calendar format</p>
        </header>

        <div class="section">
            <div class="section-title">Step 1: Select Schedule Type</div>
            <div class="type-selector">
                <div class="type-option">
                    <input type="radio" id="typeExam" name="htmlType" value="exam">
                    <label for="typeExam">Jadwal Ujian</label>
                </div>
                <div class="type-option">
                    <input type="radio" id="typeClass" name="htmlType" value="class" checked>
                    <label for="typeClass">Jadwal Kuliah</label>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Step 2: Upload HTML File</div>
            <div class="drop-zone" id="dropZone">
                <div class="drop-zone-icon">📄</div>
                <div class="drop-zone-text">Drop your HTML file here<br><span style="font-size: 12px; color: #999;">or click to browse</span></div>
            </div>
            <input type="file" id="htmlFileInput" accept=".html">
        </div>

        <div class="status-box" id="statusBox"></div>

        <button class="download-btn" id="downloadBtn">↓ Download ICS File</button>

        <footer>
            <p>Client-side only • No data sent to servers</p>
            <p style="margin-top: 10px;">
                <a href="https://github.com/refeed/SimasterICSGen">Original project</a>
            </p>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const htmlFileInput = document.getElementById('htmlFileInput');
        const statusBox = document.getElementById('statusBox');
        const downloadBtn = document.getElementById('downloadBtn');
        const toast = document.getElementById('toast');

        let currentIcsResult = null;
        let currentFilename = 'result.ics';

        // Initialize WASM
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("autogenerated/simastericsgen.wasm"), go.importObject).then(result => {
            go.run(result.instance);
        });

        // Drag & Drop
        dropZone.addEventListener('click', () => htmlFileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('active');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('active');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // File Input
        htmlFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!/\.html?$/i.test(file.name)) {
                showToast('Please select an HTML file', 'error');
                return;
            }

            showStatus('Processing...', 'loading');
            downloadBtn.classList.remove('show');
            currentFilename = file.name.replace(/\.html?$/i, '') + '.ics';

            const reader = new FileReader();
            reader.addEventListener('load', (event) => {
                try {
                    const htmlType = document.querySelector('input[name=htmlType]:checked').value;
                    const [icsResult, numEvents] = convertICSfromHTML(event.target.result, htmlType);

                    if (numEvents === 0) {
                        showStatus('No events found in the file', 'error');
                        showToast('No events found', 'error');
                        return;
                    }

                    currentIcsResult = icsResult;
                    showStatus(`✓ ${numEvents} event(s) ready to download`, 'success');
                    showToast(`Successfully processed ${numEvents} event(s)`);
                    downloadBtn.classList.add('show');
                } catch (err) {
                    console.error(err);
                    showStatus('Error processing file', 'error');
                    showToast('Error processing file', 'error');
                }
            });
            reader.readAsText(file);
        }

        function showStatus(message, type) {
            statusBox.textContent = '';
            if (type === 'loading') {
                statusBox.innerHTML = `<span class="spinner"></span>${message}`;
            } else {
                statusBox.textContent = message;
            }
            statusBox.className = `status-box show ${type}`;
        }

        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        downloadBtn.addEventListener('click', () => {
            if (currentIcsResult) {
                download(currentFilename, currentIcsResult);
                showToast('File downloaded');
            }
        });

        function download(filename, text) {
            const element = document.createElement('a');
            element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
            element.setAttribute('download', filename);
            element.style.display = 'none';
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }
    </script>
</body>
</html>
